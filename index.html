<body>
    <script>
       let n1 = 10

       n1 += 5

       n1 *= 3

       n1 ++

       alert(" O resto da divisão de " + n1 + " por 6 é: " + (n1 % 6) ** 2);

       n1 = n1 / 4

         alert(" O valor de n1 é: " + n1 );
    </script>
</body>
