<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino</title>
</head>
<body>
    <script>
    // pedir para o usuario digitar 2 numerosentre 0 e 10 
        let n1 = parseInt(Prompt("digite uma numero entra 0 e 10: "));
        let n2 = parseInt(prompt("digite OUTRO numero entre 0 e 10: "));

        // calacular media

        let media = (n1 + n2 ) / 2 ;
         
         
        // Boleano se media for maior ou igual a 7
        
        alert(" a sua media é maior ou ifual a 7: " + (media >= 7));
</script>
</body>
</html>
